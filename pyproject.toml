[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vascular-branching"
version = "0.1.0"
description = "Generate and visualise fractal branching transport networks: DLA, space colonization, Murray's law, and CSG trees."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vessel Weaver" }]
keywords = ["fractal", "vascular", "dla", "space-colonization", "murray-law", "generative", "branching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vascular = "vascular.cli:main"

[project.urls]
Homepage = "https://github.com/merrypranxter/vascular_branching"

[tool.setuptools]
packages = ["vascular"]

[tool.pytest.ini_options]
testpaths = ["tests"]
